name: 模型转换（LaMa → Core ML）

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 拉取 LaMa 源码与权重
        working-directory: scripts
        run: |
          git clone --depth 1 https://github.com/advimman/lama.git lama
          curl -L --retry 3 -o big-lama.zip \
            https://github.com/advimman/lama/releases/download/v1.0/big-lama.zip
          unzip -q -o big-lama.zip
          ls -la big-lama/models | head

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" torch==2.2.2 coremltools==8.0 omegaconf
          # LaMa 运行所需的最小集（完整 requirements 太重）
          pip install pytorch-lightning kornia scikit-image opencv-python-headless \
                      easydict pandas pyyaml tqdm

      - name: 转换
        working-directory: scripts
        run: |
          python convert_lama.py

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coreml-model
          path: |
            scripts/LaMaInpaint.mlpackage
            scripts/*.log
          if-no-files-found: warn
